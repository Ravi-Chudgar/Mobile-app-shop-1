# Cafe POS demo stack: local AWS emulator (Floci) + Flask API + optional
# Cloudflare tunnel for demos beyond the LAN.
#
#   cp .env.example .env           # optional — defaults work without it
#   docker compose up -d --build   # API on http://localhost:9999
#   docker compose logs -f backend # first boot prints the seed logins
#
# Public demo URL (random trycloudflare.com address):
#   docker compose --profile tunnel up -d tunnel
# Stable named tunnel: set TUNNEL_TOKEN in .env first, then
#   docker compose --profile tunnel-token up -d named-tunnel
#
# Ollama keeps running on the host (models live there); the backend reaches it
# via host-gateway. Don't run `floci start` while this stack is up — both want
# port ${FLOCI_PORT:-4566}.

services:
  # Local AWS emulator: the DynamoDB tables + S3 bucket for menu photos.
  floci:
    image: floci/floci:latest
    restart: unless-stopped
    # Persist emulator data to /app/data (the floci-data volume) so it
    # survives container restarts. Without this flag Floci is in-memory only
    # and every `docker compose up`/recreate wipes the database.
    environment:
      # Storage engine mode: "persistent" writes to FLOCI_STORAGE_PERSISTENT_PATH
      # (/app/data, the floci-data volume) so the database survives restarts.
      # Without this Floci runs in-memory and every recreate wipes all data.
      FLOCI_STORAGE_MODE: "persistent"
      FLOCI_STORAGE_PERSISTENT: "true"
      FLOCI_STORAGE_PERSISTENT_PATH: "/app/data"
    ports:
      - "${FLOCI_PORT:-4566}:4566"
    volumes:
      # DB data survives down/up; wipe with `down -v`.
      - floci-data:/app/data
      # Floci's web UI needs the container runtime to start its visualizer,
      # so the host Docker socket must be mounted in (standard for
      # LocalStack-style emulators). Security note: this gives the floci
      # container control of the host Docker daemon — fine for local dev/demo.
      - /var/run/docker.sock:/var/run/docker.sock

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      - floci
    environment:
      # Bundled emulator by default. Set AWS_ENDPOINT_URL= (empty) in .env to
      # talk to real AWS with real creds instead.
      AWS_ENDPOINT_URL: ${AWS_ENDPOINT_URL-http://floci:4566}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-test}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-test}
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me}
      JWT_TTL_HOURS: ${JWT_TTL_HOURS:-12}
      # Browser origins allowed to call the API cross-origin (comma-separated).
      # Anything else gets no Access-Control-Allow-Origin header. The native iOS
      # app ignores this entirely (CORS is browser-only).
      CORS_ORIGINS: ${CORS_ORIGINS:-https://mobileapp.unonomercysound.online,http://localhost:9999,http://127.0.0.1:9999}
      # Ollama on the host machine.
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2:3b}
      # First-boot seed logins (printed once in `compose logs backend`).
      SEED_ADMIN_USER: ${SEED_ADMIN_USER:-owner}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-cafe123}
      SEED_ON_START: ${SEED_ON_START:-1}
      # Platform admin — a separate login that sees & controls ALL cafes.
      # Empty password = the admin login is disabled.
      PLATFORM_ADMIN_USER: ${PLATFORM_ADMIN_USER:-admin}
      PLATFORM_ADMIN_PASSWORD: ${PLATFORM_ADMIN_PASSWORD:-}
      # Rate limiting on sensitive routes (login, cafe creation, signup).
      # "0" disables it entirely (e.g. load tests).
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-1}
      # gunicorn runs 2 workers; each has its own memory limiter, so store
      # counters in Redis (its own DB, away from the cache) to share ONE budget
      # across workers. Host-run tests leave this unset -> memory:// per process.
      RATE_LIMIT_STORAGE: ${RATE_LIMIT_STORAGE:-redis://redis:6379/4}
      # Thermal printer (raw ESC/POS over TCP, usually port 9100).
      # Empty host = dry-run mode (returns bytes, prints nothing).
      ESCPOS_PRINTER_HOST: ${ESCPOS_PRINTER_HOST:-}
      ESCPOS_PRINTER_PORT: ${ESCPOS_PRINTER_PORT:-9100}
      AUTO_PRINT_KOT: ${AUTO_PRINT_KOT:-0}
      # Flutter web release build served by the API so any public URL
      # (tunnel/LAN) loads the actual app UI (see app/routes/webapp.py).
      WEB_DIST: /srv/web
    ports:
      - "${BACKEND_PORT:-9999}:9999"
    volumes:
      - ./mobile/build/web:/srv/web:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # Free quick tunnel — random URL each run, printed in `logs tunnel`.
  # (Image has no shell, so quick vs named are two services.)
  # NOTE: This gives a RANDOM URL each time. Use named-tunnel for static URL.
  tunnel:
    image: cloudflare/cloudflared:latest
    profiles: ["tunnel"]
    restart: unless-stopped
    depends_on:
      - backend
    command: ["tunnel", "--no-autoupdate", "--url", "http://backend:9999"]

  # Stable named tunnel — STATIC URL that never changes.
  # Setup:
  # 1. Go to https://one.dash.cloudflare.com/ → Networks → Tunnels
  # 2. Create a tunnel, add public hostname:
  #    mobileapp.unonomercysound.online → http://backend:9999
  # 3. Copy the tunnel token to TUNNEL_TOKEN in .env
  # 4. Run: docker compose --profile tunnel-token up -d named-tunnel
  # 5. Mobile app API base URL: https://mobileapp.unonomercysound.online
  named-tunnel:
    image: cloudflare/cloudflared:latest
    profiles: ["tunnel-token"]
    restart: unless-stopped
    depends_on:
      - backend
    # The Cloudflare dashboard ingress rule for this tunnel targets
    # http://localhost:9999. That only resolves to the backend when cloudflared
    # shares the HOST network namespace — under bridge networking (default),
    # localhost means the cloudflared container itself and every request 502s
    # with "connection refused".
    network_mode: host
    command: ["tunnel", "--no-autoupdate", "run", "--token",
              "${TUNNEL_TOKEN:-}"]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  floci-data:
